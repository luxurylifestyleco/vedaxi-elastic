name: Benchmark Full

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Full benchmark run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Toolcache CPython 3.12.16 ships pip 25.0.1. Do not self-upgrade it (CVE-2026-133949).
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          pip install pydantic pytest jsonschema psycopg2-binary

      - name: Run ElasticBench full benchmark
        run: |
          python packages/elastic-bench/benchmark_runner.py

      - name: Upload ElasticBench reports
        uses: actions/upload-artifact@v4
        with:
          name: elastic-bench-reports
          path: packages/elastic-bench/reports/
          if-no-files-found: warn
