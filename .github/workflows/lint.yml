name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all package and app sources
        run: |
          # py_compile every tracked .py file under packages/ and apps/.
          # This catches syntax errors without requiring ruff to be installed.
          FAILED=0
          while IFS= read -r f; do
            python -m py_compile "$f" || { echo "::error::Syntax error in $f"; FAILED=1; }
          done < <(find packages apps -name "*.py" -not -path "*/.venv/*" -not -path "*/__pycache__/*" | sort)
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more Python files failed to compile."
            exit 1
          fi
          echo "All Python sources compiled successfully."
