name: Benchmark Smoke

on:
  push:
    branches: [main]

jobs:
  smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest jsonschema psycopg2-binary

      - name: Smoke test ElasticBench runner imports
        run: |
          PYTHONPATH="packages/elastic-bench" python - <<'EOF'
          import benchmark_runner
          assert callable(benchmark_runner.run_benchmark)
          print("benchmark_runner imports and run_benchmark is callable")
          EOF
