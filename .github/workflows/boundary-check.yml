name: Boundary Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boundary:
    name: Enforce public-repo boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for prohibited proprietary-intelligence patterns
        run: |
          # This public repo must NOT contain the proprietary adaptive-intelligence
          # layer. Any match below fails the build. See AGENTS.md for the full list.
          PATTERNS=(
            "packages/adaptive-recipe"
            "meta_policy"
            "MetaPolicy"
            "RecipeCandidateCompiler"
            "recipe_candidates"
            "recipe_validation"
            "recipe_freshness"
            "recipe_challengers"
            "recipe_promotions"
            "recipe_failures"
            "meta_policy_decisions"
            "learning_curve_points"
            "intelligence_cost_per_successful_intent"
            "intelligence_cost_per_success"
            "adaptive_report"
            "adaptive_recipe_v1"
            "gen_phase20_dataset"
            "REUSE mode"
            "ADAPT mode"
            "CHALLENGE mode"
            "EXPLORE mode"
            "stale recipe"
            "stale-recipe"
            "recipe generalization"
            "autonomous recipe promotion"
            "cross-tenant learning"
            "cross-user learning"
          )
          FAILED=0
          for pat in "${PATTERNS[@]}"; do
            # Exclude this workflow file itself (it legitimately contains the
            # pattern strings) and git-ignored caches.
            if grep -rIl --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ \
                --exclude=boundary-check.yml "$pat" . 2>/dev/null | grep -q .; then
              echo "::error::Prohibited pattern found: '$pat'"
              grep -rIl --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ \
                --exclude=boundary-check.yml "$pat" . 2>/dev/null | head -5
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::This public repository must NOT contain proprietary adaptive-intelligence code. See AGENTS.md."
            exit 1
          fi
          echo "Boundary check passed: no prohibited patterns found."
