name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest jsonschema psycopg2-binary

      - name: Run demo-bank integration tests
        run: |
          PYTHONPATH="packages/capability-registry" python -m pytest apps/demo-bank -q

      - name: Run elastic-bench integration tests
        run: |
          python -m pytest packages/elastic-bench -q
