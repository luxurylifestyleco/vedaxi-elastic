[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vedaxi-elastic"
version = "0.1.0"
description = "Intent-driven semantic presentation layer: intent IR, capability registry/retrieval, progressive disclosure, recipe execution, telemetry, and benchmarking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vedaxi / luxurylifestyleco" },
]
keywords = ["intent", "capability", "mcp", "recipe", "retrieval", "semantic", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "psycopg2-binary>=2.9",
]
bench = [
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/vedaxi/vedaxi-elastic"
Documentation = "https://github.com/vedaxi/vedaxi-elastic/blob/main/README.md"

[tool.setuptools]
packages = [
    "intent_ir",
    "capability_registry",
    "capability_retrieval",
    "recipe_schema",
    "recipe_runtime",
    "elastic_bench",
    "telemetry",
]

[tool.setuptools.package-dir]
"intent_ir" = "packages/intent-ir"
"capability_registry" = "packages/capability-registry"
"capability_retrieval" = "packages/capability-retrieval"
"recipe_schema" = "packages/recipe-schema"
"recipe_runtime" = "packages/recipe-runtime"
"elastic_bench" = "packages/elastic-bench"
"telemetry" = "packages/telemetry"

[tool.setuptools.package-data]
intent_ir = ["schema.json"]
elastic_bench = ["reports/*"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
